- name: Find and Stage Zip File
        run: |
          # Find any generated zip file in Release folder
          ZIP=$(find . -path '*/bin/Release/*' -name '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "No zip file found in Release output directory."
            exit 1
          fi
          echo "Found zip at $ZIP"
          
          # Create a 'latest' directory and copy the release zip there
          mkdir -p latest
          cp "$ZIP" latest/latest.zip
          
          # Set env vars for GitHub Release step
          echo "PLUGIN_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Glare Counter ${{ env.VERSION }}
          files: |
            ${{ env.PLUGIN_ZIP }}
            latest/latest.zip
          generate_release_notes: true

      - name: Update repo.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Checkout main cleanly from remote
          git fetch origin main:main
          git checkout main

          # Update JSON
          jq --arg v "$VERSION" --argjson t "$(date +%s)" \
            '.[0].AssemblyVersion = $v | .[0].TestingAssemblyVersion = $v | .[0].LastUpdate = $t' \
            repo.json > repo.tmp
          mv repo.tmp repo.json

          # Commit & push to main branch
          git add repo.json
          if ! git diff --cached --quiet; then
            git commit -m "Update repo.json for $VERSION"
            git push origin main
          fi
