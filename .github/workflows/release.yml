name: Release

# Push a tag like v1.1.0 to build the plugin and publish a GitHub Release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  PLUGIN_NAME: GlareCounter
  DALAMUD_HOME: /tmp/dalamud

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Download Dalamud
        run: |
          curl -fsSL -o latest.zip https://goatcorp.github.io/dalamud-distrib/latest.zip
          mkdir -p "$DALAMUD_HOME"
          unzip -q latest.zip -d "$DALAMUD_HOME"

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release -p:Version=${{ steps.version.outputs.version }}

      - name: Locate plugin package
        id: package
        run: |
          ZIP=$(find . -path "*/${PLUGIN_NAME}/latest.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "latest.zip not found. Build output:"
            find . -path ./.git -prune -o -path "*/bin/*" -type f -print
            exit 1
          fi
          echo "Found $ZIP"
          cp "$ZIP" "${PLUGIN_NAME}-${GITHUB_REF_NAME}.zip"
          echo "zip=${PLUGIN_NAME}-${GITHUB_REF_NAME}.zip" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.PLUGIN_NAME }} ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.zip }}
